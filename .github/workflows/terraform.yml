name: "Terraform CI"

on:
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Format, Init, Validate & Plan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate (Dev)
        run: |
          cd infra/envs/dev
          terraform init -backend=false
          terraform validate

      - name: Terraform Plan (Dev)
        id: plan
        run: |
          cd infra/envs/dev
          terraform plan -no-color -refresh=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/dev/plan_output.txt', 'utf8');
            const output = `#### Terraform Plan Status: 🖌
            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${plan.substring(0, 60000)}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
