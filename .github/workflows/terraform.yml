name: "Terraform CI"

on:
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Format, Init, Validate & Plan"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          cd infra/envs/dev
          terraform init -reconfigure

      - name: Terraform Validate
        run: |
          cd infra/envs/dev
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd infra/envs/dev
          terraform plan -no-color -refresh=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/envs/dev/plan_output.txt

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/dev/plan_output.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan

<details>
<summary>Show Plan</summary>

\`\`\`terraform
${plan.substring(0, 60000)}
\`\`\`

</details>`
            });
